# oml-code settings
oml-code:
  schemaVersion: 1

# project npm settings
project:
  name: "@ec-chamber/method"
  version: 0.1.0
  title: Env Control Chamber
  description: The Env Control Chamber ontologies.

# source folders
sources:
  - src

# package registries (local Verdaccio)
registries:
  - url: http://localhost:4873/

# packing settings
pack:
  - include: [src/method]

# oml server settings
#   port: 8080

# oml-cli parameter defaults
defaults:
  export: -o build/owl
  reason: -o build/owl -t
  render: -m src/model/md -b build/web -c src/model/oml/www.example.com/ec-chamber/bundle.oml
  pack: -o build/dist
